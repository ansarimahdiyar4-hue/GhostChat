name: Build Ghost Chat APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="GhostChat-Upload.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in the repository root."
            echo "Repository files:"
            ls -la
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          if [ ! -f source/app/build.gradle.kts ] || [ ! -f source/build.gradle.kts ] || [ ! -f source/settings.gradle.kts ]; then
            echo "ERROR: The ZIP must have app/, build.gradle.kts, and settings.gradle.kts at its root."
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "Project ZIP extracted successfully."

      - name: Align Kotlin compiler with Firebase SDK metadata
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          target = '2.2.21'
          candidates = list(root.rglob('*.gradle.kts')) + list(root.rglob('*.gradle')) + list(root.rglob('*.toml'))
          candidates = [p for p in candidates if 'build' not in p.parts and '.gradle' not in p.parts]
          updated_files = []
          found_kotlin_version_declaration = False

          # Fix explicit Gradle Kotlin plugin declarations regardless of whether they currently
          # say 2.0.21, 2.2.21, or another version. If already correct, this remains a no-op.
          direct_patterns = [
              re.compile(r'((?:id|kotlin)\s*\(\s*["\'](?:org\.jetbrains\.kotlin\.(?:android|plugin\.compose|jvm|multiplatform|plugin\.serialization)|android|jvm|multiplatform)["\']\s*\)\s*version\s*["\'])[^"\']+(["\'])'),
              re.compile(r'(id\s+["\']org\.jetbrains\.kotlin\.(?:android|plugin\.compose|jvm|multiplatform|plugin\.serialization)["\']\s+version\s+["\'])[^"\']+(["\'])'),
          ]

          for path in candidates:
              original = path.read_text(encoding='utf-8')
              text = original
              for pattern in direct_patterns:
                  text, count = pattern.subn(lambda m: m.group(1) + target + m.group(2), text)
                  found_kotlin_version_declaration |= count > 0

              # Handle Gradle version catalogs such as [versions] kotlin = "2.0.21"
              # and kotlin-android = "...". Update only keys explicitly containing "kotlin".
              if path.name.endswith('.toml'):
                  section = ''
                  rebuilt = []
                  for line in text.splitlines(keepends=True):
                      section_match = re.match(r'^\s*\[([^]]+)\]', line)
                      if section_match:
                          section = section_match.group(1).strip().lower()
                      if section == 'versions':
                          version_match = re.match(r'^(\s*([A-Za-z0-9_.-]*kotlin[A-Za-z0-9_.-]*)\s*=\s*)["\']([^"\']+)(["\'].*)$', line, re.IGNORECASE)
                          if version_match:
                              found_kotlin_version_declaration = True
                              line = version_match.group(1) + '"' + target + '"' + line[version_match.start(4) + 1:]
                      rebuilt.append(line)
                  text = ''.join(rebuilt)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  updated_files.append(str(path))

          # Print every Kotlin plugin/version-catalog declaration for visibility. The task must
          # not fail merely because a project was already using 2.2.21 (the previous workflow did).
          relevant_lines = []
          for path in candidates:
              for line_number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if 'org.jetbrains.kotlin' in line or (path.name.endswith('.toml') and 'kotlin' in line.lower()):
                      relevant_lines.append(f'{path}:{line_number}: {line.strip()}')
          if updated_files:
              print('Kotlin declarations normalized to', target, 'in:')
              for name in updated_files:
                  print(' -', name)
          else:
              print('No textual Gradle edits were needed; checking declarations as stored.')
          print('\n'.join(relevant_lines[:80]))
          if not found_kotlin_version_declaration and not relevant_lines:
              raise SystemExit('Could not locate a Kotlin Gradle plugin declaration. Please check the ZIP project structure.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate Firebase config and database rules
        working-directory: source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('app/src/main/assets/firebase-config.json').read_text())
          required = {'apiKey', 'appId', 'projectId', 'databaseUrl', 'senderId'}
          missing = required - set(config)
          if missing:
              raise SystemExit(f'Missing Firebase config keys: {sorted(missing)}')
          if not config['databaseUrl'].startswith('https://'):
              raise SystemExit('Firebase database URL must use HTTPS')
          json.loads(Path('firebase/database.rules.json').read_text())
          print('Firebase config and database Rules JSON are valid.')
          PY

      - name: Build Ghost Chat debug APK
        working-directory: source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature
        run: |
          test -f source/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --verbose \
            source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostChat-debug-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
